name: Apply catalog BC fix

on:
  push:
    branches:
      - fix/catalogs-by-business-center
    paths:
      - scripts/apply-catalog-bc-fix.mjs
      - .github/workflows/apply-catalog-bc-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-bc-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalogs-by-business-center
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/apply-catalog-bc-fix.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
          SUPABASE_SERVICE_ROLE_KEY: example
          TIKTOK_APP_ID: example
          TIKTOK_APP_SECRET: example
          TIKTOK_REDIRECT_URI: http://localhost:3000/api/tiktok/callback
          TIKTOK_OAUTH_STATE_SECRET: example-example-example-example
          TIKTOK_TOKEN_ENCRYPTION_KEY: example-example-example-example
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: bind catalogs to each Business Center [catalog-bc-applied]"
          git push origin HEAD:fix/catalogs-by-business-center
